<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Many tools, many agents</title>
  <desc id="desc">Claude Code, Codex, Hermes, and other calling tools connect bidirectionally through Pigeon to parallel agent instances. Each provider group contains multiple agent tools, and the same tool can run on different providers. Provider groups are illustrative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8391a5"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #20334b; }
      .heading { font-size: 16px; font-weight: 600; fill: #53657a; }
      .name { font-size: 18px; text-anchor: middle; font-weight: 600; }
      .instance { font-size: 14px; text-anchor: middle; }
      .provider { font-size: 15px; font-weight: 600; }
      .card { fill: #fff; stroke: #cfdae6; stroke-width: 1.3; }
      .wire { fill: none; stroke: #8391a5; stroke-width: 1.7; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="500" rx="20" fill="#f6f8fb"/>
  <text x="40" y="42" class="heading">Calling tools</text>
  <text x="600" y="42" class="heading">Parallel agents · multiple providers</text>
  <g class="wire">
    <path d="M222 116H275L330 238H357"/>
    <path d="M222 206H275L330 250H357"/>
    <path d="M222 296H275L330 262H357"/>
    <path d="M222 386H275L330 274H357"/>
    <path d="M543 238H560L580 142H598"/>
    <path d="M543 250H598"/>
    <path d="M543 274H560L580 386H598"/>
  </g>
  <rect x="40" y="86" width="180" height="60" rx="12" class="card"/>
  <text x="130" y="123" class="name">Claude Code</text>
  <rect x="40" y="176" width="180" height="60" rx="12" class="card"/>
  <text x="130" y="213" class="name">Codex</text>
  <rect x="40" y="266" width="180" height="60" rx="12" class="card"/>
  <text x="130" y="303" class="name">Hermes</text>
  <rect x="40" y="356" width="180" height="60" rx="12" class="card"/>
  <text x="130" y="393" class="name">Other tools</text>
  <rect x="360" y="205" width="180" height="102" rx="20" fill="#203e69"/>
  <text x="450" y="256" style="fill:#fff;font-size:29px;font-weight:700;text-anchor:middle">Pigeon</text>
  <text x="450" y="282" style="fill:#d5e3f5;font-size:13px;text-anchor:middle">Run · manage · connect</text>
  <rect x="600" y="72" width="360" height="120" rx="14" fill="#eaf1fc" stroke="#cfdaee"/>
  <text x="620" y="101" class="provider">Provider A</text>
  <rect x="616" y="118" width="100" height="48" rx="9" class="card"/>
  <rect x="728" y="118" width="100" height="48" rx="9" class="card"/>
  <rect x="840" y="118" width="100" height="48" rx="9" class="card"/>
  <text x="666" y="147" class="instance">Claude #1</text>
  <text x="778" y="147" class="instance">Claude #2</text>
  <text x="890" y="147" class="instance">Hermes #1</text>
  <rect x="600" y="214" width="360" height="120" rx="14" fill="#eaf5f0" stroke="#cce2d7"/>
  <text x="620" y="243" class="provider">Provider B</text>
  <rect x="616" y="260" width="100" height="48" rx="9" class="card"/>
  <rect x="728" y="260" width="100" height="48" rx="9" class="card"/>
  <rect x="840" y="260" width="100" height="48" rx="9" class="card"/>
  <text x="666" y="289" class="instance">Codex #1</text>
  <text x="778" y="289" class="instance">Codex #2</text>
  <text x="890" y="289" class="instance">Hermes #2</text>
  <rect x="600" y="356" width="360" height="120" rx="14" fill="#f4eefb" stroke="#e0d4ed"/>
  <text x="620" y="385" class="provider">Provider C</text>
  <rect x="616" y="402" width="100" height="48" rx="9" class="card"/>
  <rect x="728" y="402" width="100" height="48" rx="9" class="card"/>
  <text x="666" y="431" class="instance">Claude #3</text>
  <text x="778" y="431" class="instance">Codex #3</text>
  <text x="890" y="431" class="name">···</text>
</svg>
